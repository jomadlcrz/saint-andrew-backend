services:
  - type: web
    name: burol-sms-backend
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: SEMAPHORE_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      # Staff email alerts (new requests, receipts, burial change requests). Optional:
      # comma-separated inboxes (default: BREVO_SENDER_EMAIL) and the admin portal link in the email
      - key: STAFF_ALERT_EMAILS
        sync: false
      - key: ADMIN_WEB_URL
        sync: false
